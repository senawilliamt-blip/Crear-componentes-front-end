<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- <meta name="viewport" content="width=device-width"> -->
    <title>Hoja de vida</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>

<!-- From Uiverse.io by chase2k25 --> 
<div class="encrypted-neon-pattern">
  <span class="data-stream-overlay"></span>
  <svg class="texture-filter">
    <filter id="neon-texture">
      <feTurbulence
        result="noise"
        numOctaves="2"
        baseFrequency="0.6"
        type="fractalNoise"
      ></feTurbulence>
      <feSpecularLighting
        result="specular"
        lighting-color="#00f0ff"
        specularExponent="25"
        specularConstant="0.9"
        surfaceScale="2"
        in="noise"
      >
        <fePointLight z="90" y="100" x="100"></fePointLight>
      </feSpecularLighting>
      <feComposite
        result="litNoise"
        operator="over"
        in2="SourceGraphic"
        in="specular"
      ></feComposite>
      <feBlend mode="screen" in2="litNoise" in="SourceGraphic"></feBlend>
    </filter>
  </svg>
</div>

</body>
</html>
